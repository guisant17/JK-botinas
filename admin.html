<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JK BOTINAS | Painel Administrativo</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="admin-login-screen" id="loginScreen">

    <div class="admin-login-box">

        <h2>Painel Administrativo</h2>

        <p class="admin-login-sub">JK Botinas</p>

        <input
            type="email"
            id="loginEmail"
            placeholder="E-mail"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Senha"
        >

        <button class="btn" onclick="fazerLogin()">
            Entrar
        </button>

        <p class="admin-login-error" id="loginError"></p>

    </div>

</div>


<!-- ================= PAINEL ================= -->

<div class="admin-panel" id="adminPanel" style="display:none">

    <header class="admin-header">

        <h1>Painel Administrativo — JK Botinas</h1>

        <button class="btn btn-outline" onclick="fazerLogout()">
            Sair
        </button>

    </header>


    <main class="admin-content">
<!-- Form de Cadastro de Novos Produtos -->
<section style="background: #111; padding: 20px; border: 1px solid #262626; margin-bottom: 40px;">
    <h3 style="color: var(--gold); margin-bottom: 15px; font-family: Georgia, serif;">Cadastrar Novo Produto</h3>
    
    <form id="formNovoProduto" onsubmit="cadastrarProduto(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
        <input type="text" id="novoNome" placeholder="Nome do Produto" required style="padding:10px; background:#0a0a0a; border:1px solid #333; color:#fff;">
        
        <select id="novaCategoria" required style="padding:10px; background:#0a0a0a; border:1px solid #333; color:#fff;">
            <option value="">Selecione a Categoria</option>
            <option value="botas">Botas</option>
            <option value="roupas">Roupas</option>
            <option value="chapeus">Chapéus</option>
            <option value="acessorios">Acessórios</option>
        </select>
        
        <input type="number" step="0.01" id="novoPreco" placeholder="Preço (ex: 199.90)" required style="padding:10px; background:#0a0a0a; border:1px solid #333; color:#fff;">
        
        <input type="number" id="novoEstoque" placeholder="Estoque Inicial" min="0" required style="padding:10px; background:#0a0a0a; border:1px solid #333; color:#fff;">
        
        <input type="url" id="novaImagem" placeholder="URL da Imagem (opcional)" style="padding:10px; background:#0a0a0a; border:1px solid #333; color:#fff;">
        
        <button type="submit" class="btn" style="grid-column: 1 / -1; cursor:pointer;">Cadastrar Produto</button>
    </form>
    <p id="msgCadastro" style="margin-top:10px; font-size:14px;"></p>
</section>



        <h2>Estoque de produtos</h2>

        <p class="admin-hint">
            Altere a quantidade e clique em "Salvar" na linha do produto.
        </p>

        <table class="admin-table" id="adminTable">

            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th></th>
                </tr>
            </thead>

            <tbody id="adminTableBody">
                <tr>
                    <td colspan="5">Carregando produtos...</td>
                </tr>
            </tbody>

        </table>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>

</body>
</html>
